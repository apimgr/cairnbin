# pastebin - test compose
# FOR AI AND AUTOMATED TESTING - the ONLY docker-compose file AI may use.
# MUST be copied to a temp directory before running — NEVER run from project directory.
#
# Workflow:
#   mkdir -p "${TMPDIR:-/tmp}/apimgr"
#   TEMP_DIR=$(mktemp -d "${TMPDIR:-/tmp}/apimgr/pastebin-XXXXXX")
#   mkdir -p "$TEMP_DIR/volumes/config" "$TEMP_DIR/volumes/data"
#   cp docker/docker-compose.test.yml "$TEMP_DIR/docker-compose.yml"
#   cd "$TEMP_DIR" && docker compose up --abort-on-container-exit
#   rm -rf "$TEMP_DIR"

name: pastebin

x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  pastebin:
    image: ghcr.io/apimgr/pastebin:devel
    pull_policy: always
    container_name: pastebin-app
    hostname: pastebin
    restart: "no"
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
      TERMBIN_ENABLED: true
      CACHE_URL: valkey://pastebin-cache:6379
      PASTEBIN_E2E_UPDATE_API_URL: http://pastebin-e2e-runner:64980/update
      PASTEBIN_E2E_GEOIP_BASE_URL: http://pastebin-e2e-runner:64980/geoip
      PASTEBIN_E2E_GEOIP_SKIP_INITIAL_DOWNLOAD: "true"
    volumes:
      # CRITICAL: ./volumes/ must resolve to $TEMP_DIR/volumes/, NOT project directory
      # This file MUST be copied to a temp directory before running
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64581:80"
    healthcheck:
      test: ['CMD', '/usr/local/bin/pastebin', '--status']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      pastebin-cache:
        condition: service_healthy
    networks:
      - pastebin

  pastebin-e2e-browser:
    image: chromedp/headless-shell:latest
    pull_policy: always
    container_name: pastebin-e2e-browser
    restart: "no"
    logging: *default-logging
    networks:
      - pastebin

  pastebin-cache:
    image: valkey/valkey:alpine
    pull_policy: always
    container_name: pastebin-cache
    restart: "no"
    logging: *default-logging
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - pastebin

networks:
  pastebin:
    name: pastebin
    external: false
