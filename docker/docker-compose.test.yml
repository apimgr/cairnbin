# cairnbin - test compose
# FOR AI AND AUTOMATED TESTING - the ONLY docker-compose file AI may use.
# MUST be copied to a temp directory before running — NEVER run from project directory.
#
# Workflow:
#   mkdir -p "${TMPDIR:-/tmp}/apimgr"
#   TEMP_DIR=$(mktemp -d "${TMPDIR:-/tmp}/apimgr/cairnbin-XXXXXX")
#   mkdir -p "$TEMP_DIR/volumes/config" "$TEMP_DIR/volumes/data"
#   cp docker/docker-compose.test.yml "$TEMP_DIR/docker-compose.yml"
#   cd "$TEMP_DIR" && docker compose up --abort-on-container-exit
#   rm -rf "$TEMP_DIR"

name: cairnbin

x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  cairnbin:
    image: ghcr.io/apimgr/cairnbin:devel
    pull_policy: always
    container_name: cairnbin-app
    hostname: cairnbin
    restart: "no"
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
      TERMBIN_ENABLED: true
      CACHE_URL: valkey://cairnbin-cache:6379
      CAIRNBIN_E2E_UPDATE_API_URL: http://cairnbin-e2e-runner:64980/update
      CAIRNBIN_E2E_GEOIP_BASE_URL: http://cairnbin-e2e-runner:64980/geoip
      CAIRNBIN_E2E_GEOIP_SKIP_INITIAL_DOWNLOAD: "true"
    volumes:
      # CRITICAL: ./volumes/ must resolve to $TEMP_DIR/volumes/, NOT project directory
      # This file MUST be copied to a temp directory before running
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64581:80"
    healthcheck:
      test: ['CMD', '/usr/local/bin/cairnbin', '--status']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      cairnbin-cache:
        condition: service_healthy
    networks:
      - cairnbin

  cairnbin-e2e-browser:
    image: chromedp/headless-shell:latest
    pull_policy: always
    container_name: cairnbin-e2e-browser
    restart: "no"
    logging: *default-logging
    networks:
      - cairnbin

  cairnbin-cache:
    image: valkey/valkey:alpine
    pull_policy: always
    container_name: cairnbin-cache
    restart: "no"
    logging: *default-logging
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cairnbin

networks:
  cairnbin:
    name: cairnbin
    external: false
