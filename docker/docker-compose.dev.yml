# nginx proxy address - http://172.17.0.1:64580
# cairnbin - development
# FOR HUMAN USE ONLY - AI must never use this file directly.
# Use temp dir workflow: cp docker/docker-compose.dev.yml $TEMP_DIR/docker-compose.yml

name: cairnbin

x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  cairnbin:
    image: ghcr.io/apimgr/cairnbin:${IMAGE_TAG:-devel}
    pull_policy: always
    container_name: cairnbin-app
    hostname: cairnbin
    restart: always
    logging: *default-logging
    environment:
      MODE: development
      DEBUG: true
      PORT: 80
      TZ: America/New_York
      TERMBIN_ENABLED: true
    ports:
      # Development: accessible from all interfaces, no 172.17.0.1 bind
      - '${HTTP_PORT:-64580}:80'
      - '${TERMBIN_PORT:-9999}:9999'
    volumes:
      # TEMP DIR WORKFLOW: ./volumes/ resolves to $TEMP_DIR/volumes/
      # NEVER run from project directory — always use temp dir workflow
      - '${CONFIG_PATH:-./volumes/config}:/config'
      - '${DATA_PATH:-./volumes/data}:/data'
    healthcheck:
      test: ['CMD', '/usr/local/bin/cairnbin', '--status']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - cairnbin

networks:
  cairnbin:
    name: cairnbin
    external: false
